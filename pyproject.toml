[project]
name = "astrotrain"
version = "0.1.0"
description = ""
authors = [
    {name = "Andrew Kouré",email = "andrew@koure.org"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tensorflow (>=2.20.0,<3.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "pyarrow>=21.0.0,<26.0.0",
    "numpy (>=2.3.3,<3.0.0)",
    "pandas>=2.3.3,<4.0.0",
    "lightgbm>=4.5",
]

[project.optional-dependencies]
gpu = [
    "tensorflow[and-cuda]>=2.20.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside Keras/TensorFlow under numpy 2, not by our code
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]

[tool.ruff.lint]
select = ["E", "W", "F"]

[build-system]
requires = ["uv_build>=0.10.1,<0.11.0"]
build-backend = "uv_build"
