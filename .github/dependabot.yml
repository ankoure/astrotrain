version: 2
updates:
- package-ecosystem: uv
  directory: "/"
  schedule:
    interval: monthly
  # One PR a month for all Python packages, so TensorFlow, Keras and numpy
  # land together and the tests check them as a set
  groups:
    python:
      patterns:
        - "*"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  groups:
    actions:
      patterns:
        - "*"
